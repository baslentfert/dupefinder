[workspace]
members = ["src-tauri", "crates/dupe-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Bas Lentfert"]
license = "MIT"

[workspace.dependencies]
dupe-core = { path = "crates/dupe-core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

rayon = "1.12"
crossbeam-channel = "0.5"
dashmap = "6"
parking_lot = "0.12"

blake3 = { version = "1.8", features = ["mmap", "rayon"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memmap2 = "0.9"
ignore = "0.4"

image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "gif", "webp", "bmp", "tiff", "ico",
] }
kamadak-exif = "0.6"

redb = "4"

trash = "5"

winreg = "0.56"
lnk = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Dev builds of the engine are unusably slow without optimised deps
# (blake3, image decoding, DCT). Optimise dependencies even in debug.
[profile.dev.package."*"]
opt-level = 3
